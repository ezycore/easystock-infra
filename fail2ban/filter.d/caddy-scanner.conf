# Vulnerability-scanner probes in Caddy's JSON access log.
#
# Twin of `block_scanner_paths` in infra/Caddyfile: Caddy already closes these
# requests, and this filter bans the IP that keeps sending them. Change both together.
#
# Only the path is matched, never the query string, so a shopper's
# /login?callbackUrl=/actuator/... is not counted. /wp-content/ and /wp-json/ are left
# out on purpose: real UriiBaba shoppers still follow old WordPress links.
#
# Unlike the Caddy block, plain /wp-admin and /wp-login.php do NOT count here. Several
# merchants moved from WooCommerce and still open old bookmarks: on 2026-11-18 UriiBaba's
# own staff IP asked for /wp-admin/admin.php?page=wc-orders. Three of those in an hour
# would ban a merchant from their own shop. Scanners that send them also send .env/.git
# probes, so they are caught anyway.
#
# Test against a real log before changing anything:
#   sudo fail2ban-regex /opt/easystock/infra/logs/access.log /etc/fail2ban/filter.d/caddy-scanner.conf

[Definition]
failregex = ^\{.*"client_ip":"<HOST>".*"uri":"[^"?]*(?i:/\.(?:env|git|aws|svn|hg|ds_store|htpasswd)|/wp-admin/(?:install|setup-config)\.php|/wp-config|/xmlrpc\.php|/(?:php)?info\.php|/phpmyadmin|/actuator(?:/|\?|")|/cgi-bin/)
ignoreregex =
datepattern = "ts":{EPOCH}
