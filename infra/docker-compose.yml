services:
  caddy:
    build: .                    # custom image: Caddy + Cloudflare DNS plugin (see Dockerfile)
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # DNS-01 challenge token for the *.ezycore.com wildcard cert. Lives in
      # /opt/easystock/infra/.env on the server (gitignored) — see templates/infra.env.example.
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # Shared secret for the on-demand-TLS `ask` endpoint (custom domains). MUST
      # match backend-prod's DOMAIN_CHECK_SECRET. See CUSTOM-DOMAINS-P1.md.
      - DOMAIN_CHECK_SECRET=${DOMAIN_CHECK_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Access logs. A BIND mount, not a named volume, on purpose: the rollup jobs and
      # any `grep` during an incident run on the host, and a named volume would put the
      # only copy of the request history behind `docker exec`. Caddy rolls and gzips the
      # files itself (see the ACCESS LOGS section of the Caddyfile for retention).
      # Created on first `up` if missing; root-owned, like the container that writes it.
      - ./logs:/var/log/caddy
      - caddy_data:/data        # stores HTTPS certificates (persisted)
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true              # created once with: docker network create edge

volumes:
  caddy_data:
  caddy_config:
