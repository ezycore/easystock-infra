# Dozzle — admin-only live log viewer for every container on this host.
# Replaced Portainer (2026-08-04): logs/triage were the only thing it was ever
# used for, and Dozzle does that with a READ-ONLY socket.
#
# Security model:
#   • Socket is mounted `:ro` — Dozzle can read logs and container metadata, and
#     cannot start/stop/exec anything. (Portainer needed RW = root on the host.)
#   • NO published host port → never on the public IP. Since 2026-10-26 the only
#     way in is a Cloudflare Tunnel (`cloudflared` on the shared `edge` network →
#     dozzle:8080) behind Cloudflare Access. Caddy no longer proxies it: its
#     dozzle.ezycore.com block `abort`s, because proxying there let a request sent
#     straight to the server IP skip Access (see infra/Caddyfile).
#   • Two gates: Cloudflare Access first, then Dozzle's own `simple` auth provider.
#     Keep the account in data/users.yml strong anyway — it is the last line if
#     Access is ever misconfigured. See "First-time setup" below.
#
# ⚠️ Do NOT set DOZZLE_ENABLE_ACTIONS=true. The restart/stop buttons it unlocks
#    need a read-write socket, which throws away the reason we moved off Portainer.
#    Container lifecycle stays on the CLI over SSH (`docker compose up -d`), which
#    is also what CI does — a UI that fights `docker compose` causes drift.
#
# FIRST-TIME SETUP (and to add/rotate a user) — run ON THE SERVER, never commit
# the result: data/users.yml holds bcrypt password hashes and is gitignored.
#
#   mkdir -p /opt/easystock/dozzle/data
#   docker run --rm amir20/dozzle:v10.6.14 generate \
#       --name "Admin" --email admin@ezycore.com --password '<STRONG-PASSWORD>' admin \
#       > /opt/easystock/dozzle/data/users.yml
#   docker compose up -d --force-recreate dozzle
#
# The trailing `admin` is the LOGIN USERNAME; --name is just the display name.
# `generate` prints to stdout, so the `>` redirect is what creates the file.
# Without data/users.yml, Dozzle starts with NO usable account and every login
# fails with "Username or password are not valid".
#
# Deploy:  cd /opt/easystock/dozzle && docker compose up -d
services:
  dozzle:
    image: amir20/dozzle:v10.6.14           # bump deliberately; `docker compose pull` after editing
    container_name: dozzle
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Dozzle owns its own login (bcrypt + session cookie), behind Cloudflare
      # Access — see the security model above.
      DOZZLE_AUTH_PROVIDER: simple
      # Session lifetime; re-login after this.
      DOZZLE_AUTH_TTL: 720h
      # Keep the last N lines per container in the UI's initial fetch.
      DOZZLE_TAILSIZE: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the DIRECTORY, not data/users.yml directly: a single-file bind mount
      # pins an inode, so rewriting the file (generate >, git, most editors) leaves
      # the container reading the old deleted one. This bit us on infra/Caddyfile.
      - ./data:/data
    networks: [edge]
    # NOTE: intentionally NO `ports:` — reachable only via the edge network (Caddy).

networks:
  edge:
    external: true     # shared with Caddy + the app stacks

# Dozzle streams logs over SSE, so the Caddy block in front of it must not buffer
# or impose a response timeout. Caddy's default `reverse_proxy` streams correctly —
# do not add `flush_interval`/timeout directives there without testing the stream.
#
# OPTIONAL HARDENING (defense in depth): front the socket with
# tecnativa/docker-socket-proxy (CONTAINERS=1, POST=0) so even the read-only mount
# is narrowed to the endpoints Dozzle needs. See SECRETS-AND-RECOVERY.md.
